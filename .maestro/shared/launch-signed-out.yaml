# Starts the development build from nothing — no app data, no stored token, the default language —
# and points it at the running Metro server (`npm start`).
#
# Every permission is granted up front, so no system prompt interrupts a flow. Input
# NOTIFICATIONS (`allow` by default) overrides the notification permission: `unset` lets the app's
# own prompt after sign-in appear, which the notifications flows answer.
appId: com.example.customers.dev
---
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      all: allow
      notifications: ${NOTIFICATIONS || 'allow'}
- runFlow: open-dev-server.yaml
- extendedWaitUntil:
    visible: 'Unesite email adresu i poslaćemo vam kod za prijavu.'
    timeout: 60000
