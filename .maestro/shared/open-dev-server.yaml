# Cold-starts the development build straight into the bundle from Metro on localhost:8081
# (`adb reverse` on Android). The `__expo_*` flags are the ones Expo CLI itself uses: no launcher
# screen, no first-run dev menu, and no floating dev-menu button — it sits over the header's
# right-hand buttons and would take their taps.
appId: com.example.customers.dev
---
- stopApp
- openLink: 'exp+expo-external-ai-setup://?__expo_url=http%3A%2F%2Flocalhost%3A8081&__expo_disable_fab=1&__expo_disable_auto_launch=1&__expo_disable_onboarding=1'
# The first link into a freshly installed app on an iOS simulator asks "Open in …?" once.
- extendedWaitUntil:
    visible: 'Unesite email adresu.*|Enter your email.*|Runtime version.*|Ćao.*|Hi.*|Open in .*'
    timeout: 60000
- repeat:
    while:
      visible: 'Open in .*'
    times: 3
    commands:
      - tapOn: 'Open'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Unesite email adresu.*|Enter your email.*|Runtime version.*|Ćao.*|Hi.*'
    timeout: 60000
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Runtime version.*'
    commands:
      - tapOn: 'Close'
