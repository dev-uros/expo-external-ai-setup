# Any signed-in user can browse the accounts: everyone with their status, a search that works
# without Serbian letters, a sentence when nothing matches, and the detail of one account.
# Read-only, so nothing needs to be reset afterwards.
appId: com.example.backoffice.dev
tags: [users]
---
- runFlow: ../shared/launch-signed-out.yaml
- runFlow:
    file: ../shared/sign-in.yaml
    env:
      EMAIL: ana.nikolic@fifthguild.com
      PASSWORD: password
- extendedWaitUntil:
    visible: 'Dobro došli, Ana.'
    timeout: 15000

- tapOn: 'Korisnici'
- extendedWaitUntil:
    visible: 'Milica Jovanović, .*'
    timeout: 15000
# The three states, as on the web.
- assertVisible: 'Jovana Stanković, .*, Nije aktiviran'
- assertVisible: 'Nikola Ilić, .*, Isključen'

# Search: on iOS the field sits under the title, on Android it opens from the header icon.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Pretraži po imenu ili emailu'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'Search'
# Typed without diacritics, as people do on a phone.
- inputText: 'jovanovic'
- extendedWaitUntil:
    notVisible: 'Ana Nikolić, .*'
    timeout: 5000
- assertVisible: 'Milica Jovanović, .*'

# Nothing matching is said in words.
- eraseText: 20
- inputText: 'nepostojeci'
- extendedWaitUntil:
    visible: 'Nema rezultata'
    timeout: 5000

# The detail of one account.
- eraseText: 20
- inputText: 'milica'
- tapOn: 'Milica Jovanović, .*'
- extendedWaitUntil:
    visible: 'Email: milica.jovanovic@fifthguild.com'
    timeout: 15000
- assertVisible: 'Uloga: Administrator'
