# The theme is chosen on the profile — system, light or dark, as on the web — applied at once and
# said in words. Ends on "Sistemska" so the next flow starts as the device is.
appId: com.example.backoffice.dev
tags: [profile]
---
- runFlow: ../shared/launch-signed-out.yaml
- runFlow:
    file: ../shared/sign-in.yaml
    env:
      EMAIL: ana.nikolic@fifthguild.com
      PASSWORD: password
- extendedWaitUntil:
    visible: 'Dobro došli, Ana.'
    timeout: 15000
- tapOn: 'Profil'
- scrollUntilVisible:
    element: 'Izgled'
    direction: DOWN

- tapOn: 'Tamna'
- assertVisible: 'Trenutno je uključena tamna tema.'
- tapOn: 'Svetla'
- assertVisible: 'Trenutno je uključena svetla tema.'

# The choice survives a restart of the app.
- stopApp
- runFlow: ../shared/open-dev-server.yaml
- extendedWaitUntil:
    visible: 'Dobro došli, Ana.'
    timeout: 30000
- tapOn: 'Profil'
- scrollUntilVisible:
    element: 'Izgled'
    direction: DOWN
- assertVisible: 'Trenutno je uključena svetla tema.'

- tapOn: 'Sistemska'
