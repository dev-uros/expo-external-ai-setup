# The backend's answers, shown as it wrote them: wrong password (401), switched-off account (403).
appId: com.example.backoffice.dev
tags: [auth]
---
- runFlow: ../shared/launch-signed-out.yaml
- runFlow:
    file: ../shared/sign-in.yaml
    env:
      EMAIL: uros.minic@fifthguild.com
      PASSWORD: wrong-password
- extendedWaitUntil:
    visible: 'Neispravni podaci za prijavu.'
    timeout: 15000
- runFlow: ../shared/launch-signed-out.yaml
- runFlow:
    file: ../shared/sign-in.yaml
    env:
      EMAIL: nikola.ilic@fifthguild.com
      PASSWORD: password
- extendedWaitUntil:
    visible: 'Nalog je isključen. Obratite se administratoru.'
    timeout: 15000
