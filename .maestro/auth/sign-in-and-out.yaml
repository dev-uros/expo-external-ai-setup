# An address with an account gets a code; the code signs in, the home screen greets by the shown
# name. Signing out asks first and lands back on the welcome screen. A restart keeps the session.
appId: com.example.customers.dev
tags: [auth]
---
- runFlow: ../shared/launch-signed-out.yaml
- runFlow:
    file: ../shared/sign-in.yaml
    env:
      EMAIL: maestro@example.com
- extendedWaitUntil:
    visible: 'Ćao, maestro_demo'
    timeout: 20000

- stopApp
- runFlow: ../shared/open-dev-server.yaml
- extendedWaitUntil:
    visible: 'Ćao, maestro_demo'
    timeout: 30000

- tapOn: 'Podešavanja'
- scrollUntilVisible:
    element:
      id: 'sign-out'
    direction: DOWN

# Cancel keeps the session.
- tapOn:
    id: 'sign-out'
- tapOn: 'Otkaži'
- assertNotVisible: 'Da li ste sigurni da želite da se odjavite?'

# Confirming signs out. On iOS the screen's own "Odjavi se" stays in the hierarchy behind the
# alert, and Maestro orders the matches top to bottom; the alert sits mid-screen and the button
# low on Settings, so the alert's comes first. Android's dialog leaves only one.
- tapOn:
    id: 'sign-out'
- assertVisible: 'Da li ste sigurni da želite da se odjavite?'
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Odjavi se'
          index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'Odjavi se'
- extendedWaitUntil:
    visible: 'Unesite email adresu i poslaćemo vam kod za prijavu.'
    timeout: 15000
