# Happy path: sign in, land on home, the session survives a restart, the profile shows who is
# signed in, and signing out asks first.
appId: com.example.backoffice
tags: [auth]
---
- runFlow: ../shared/launch-signed-out.yaml
- runFlow:
    file: ../shared/sign-in.yaml
    env:
      EMAIL: uros.minic@fifthguild.com
      PASSWORD: password
- extendedWaitUntil:
    visible: 'Dobro došli, Uroš.'
    timeout: 15000
# Restart without clearing anything: the stored token is checked with /auth/me.
- stopApp
- runFlow: ../shared/open-dev-server.yaml
- extendedWaitUntil:
    visible: 'Dobro došli, Uroš.'
    timeout: 30000
- tapOn: 'Profil'
- assertVisible: 'Uroš Minić'
- assertVisible: 'Administrator'
- assertVisible: 'Promeni profilnu sliku'
# The admin has no picture: initials stand in. On iOS the avatar is a single accessibility
# element (the button), so the initials inside it are not separately visible to Maestro.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: 'UM'

# Android only (iOS alerts have no back): the confirmation closes on the system back button and
# on the back gesture (a swipe in from the screen edge) without signing out.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'Odjavi se'
      - assertVisible: 'Da li ste sigurni da želite da se odjavite?'
      - back
      - assertNotVisible: 'Da li ste sigurni da želite da se odjavite?'
      - assertVisible: 'Uroš Minić'
      - tapOn: 'Odjavi se'
      - assertVisible: 'Da li ste sigurni da želite da se odjavite?'
      - swipe:
          start: 0%, 50%
          end: 60%, 50%
          duration: 300
      - assertNotVisible: 'Da li ste sigurni da želite da se odjavite?'
      - assertVisible: 'Uroš Minić'

# Cancel keeps the session too.
- tapOn: 'Odjavi se'
- tapOn: 'Otkaži'
- assertNotVisible: 'Da li ste sigurni da želite da se odjavite?'
- assertVisible: 'Uroš Minić'

# Confirming signs out. The screen's own button stays in the iOS hierarchy behind the alert, so
# the alert's button is picked by its position below the question.
- tapOn: 'Odjavi se'
- assertVisible: 'Da li ste sigurni da želite da se odjavite?'
- tapOn:
    text: 'Odjavi se'
    below: 'Da li ste sigurni da želite da se odjavite\?'
- extendedWaitUntil:
    visible: 'Prijavite se svojim poslovnim nalogom.'
    timeout: 15000
