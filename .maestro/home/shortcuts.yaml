# The home screen gathers the screens this person opens most, with how often, and forgets them
# on request. A fresh install starts with none.
appId: com.example.backoffice
tags: [home]
---
- runFlow: ../shared/launch-signed-out.yaml
- runFlow:
    file: ../shared/sign-in.yaml
    env:
      EMAIL: ana.nikolic@fifthguild.com
      PASSWORD: password
- extendedWaitUntil:
    visible: 'Dobro došli, Ana.'
    timeout: 15000
- assertVisible: 'Ovde se same skupljaju ekrani.*'

# One visit to the list, one to Milica.
- tapOn: 'Korisnici'
- tapOn: 'Milica Jovanović, .*'
- extendedWaitUntil:
    visible: 'Email: milica.jovanovic@fifthguild.com'
    timeout: 15000
- tapOn: 'Početna'
- assertVisible: 'Korisnici, 1 poseta'
- assertVisible: 'Milica Jovanović, 1 poseta'

# Back to the tab, which still shows Milica: a second visit. Now there is also a "Korisnici"
# shortcut tile: on iOS the tile is one element labelled "Korisnici, 1 poseta", but Maestro on
# Android also sees its inner text, so there the tab is the second "Korisnici" on screen.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: 'Korisnici'
          index: 1
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Korisnici'
- extendedWaitUntil:
    visible: 'Email: milica.jovanovic@fifthguild.com'
    timeout: 10000
- tapOn: 'Početna'
- assertVisible: 'Milica Jovanović, 2 posete'

# A shortcut opens its screen (and counts as a visit too).
- tapOn: 'Milica Jovanović, 2 posete'
- extendedWaitUntil:
    visible: 'Email: milica.jovanovic@fifthguild.com'
    timeout: 15000
- tapOn: 'Početna'
- assertVisible: 'Milica Jovanović, 3 posete'

# Forgetting them.
- tapOn: 'Obriši prečice'
- assertVisible: 'Ovde se same skupljaju ekrani.*'
